[package]
name = "tennis_data_scraper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fantoccini = { version = "0" }
scraper = "0"
reqwest = { version = "0.11", features = ["blocking"] }
tokio = { version = "1.33.0", features = ["full"] }
csv = "1.3.0"
serde_json = "1"
rayon = "1.12.0"


[profile.release]
opt-level = 3
debug = false
rpath = false
lto = "fat"
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
